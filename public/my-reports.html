<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports - CivicFix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">

    <div class="header-title">
        <h1>CivicFix</h1>
        <span>Smart Civic Issue & Road Hazard Tracker</span>
    </div>

    <div class="header-actions">
        <div class="lang-selector-container notranslate" translate="no">
            <div class="lang-select-wrapper">
                <svg class="lang-globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
                </svg>
                <select class="lang-select notranslate" aria-label="Choose Language">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                    <option value="bn">বাংলা (Bengali)</option>
                    <option value="mr">मराठी (Marathi)</option>
                    <option value="te">తెలుగు (Telugu)</option>
                    <option value="ta">தமிழ் (Tamil)</option>
                    <option value="gu">ગુજરાતી (Gujarati)</option>
                    <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                    <option value="ur">اردو (Urdu)</option>
                    <option value="kn">ಕನ್ನಡ (Kannada)</option>
                    <option value="ml">മലയാളം (Malayalam)</option>
                    <option value="or">ଓଡ଼ିଆ (Odia)</option>
                </select>
                <svg class="lang-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>

        <div class="profile-container">

        <button
            type="button"
            id="profileButton"
            class="profile-button">
            <span id="profileInitial">P</span>
        </button>

        <div id="profileMenu" class="profile-menu">

            <div class="profile-info">
                <strong id="profileName">Citizen</strong>
                <small id="profileEmail">email@example.com</small>
                <span
                    id="profileRole"
                    class="profile-role">
                    CITIZEN
                </span>
            </div>

            <button
                type="button"
                id="dashboardButton">
                🏠 Dashboard
            </button>

            <button
                type="button"
                id="communityButton">
                🌐 Community Issues
            </button>

            <button
                type="button"
                id="myReportsButton">
                📋 My Reports
            </button>

            <button
                type="button"
                id="adminDashboardButton"
                style="display: none;">
                🛠️ Admin Dashboard
            </button>

            <button
                type="button"
                id="logoutButton"
                class="logout-button">
                🚪 Logout
            </button>

        </div>

    </div>

    </div>

</header>


<main class="container">

    <section class="dashboard-welcome">

        <h1>My Reported Issues</h1>

        <p>
            View and manage the civic issues you have reported.
        </p>

    </section>


    <section class="report-card">

        <h2>Your Reports</h2>

        <p class="details-help">
            Click on a report to view its complete details.
        </p>

        <button
            type="button"
            id="reportNewButton"
            class="auth-button report-new-button">
            + Report New Issue
        </button>

        <div
            id="myIssues"
            class="issue-list">

            <p>Loading your reports...</p>

        </div>

    </section>

</main>


<script src="language.js"></script>
<script src="my-reports.js"></script>

</body>
</html>
