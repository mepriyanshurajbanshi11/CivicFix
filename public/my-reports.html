<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reports - CivicFix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">

    <div class="header-title">
        <h1>CivicFix</h1>
        <span>Smart Civic Issue & Road Hazard Tracker</span>
    </div>

    <div class="profile-container">

        <button
            type="button"
            id="profileButton"
            class="profile-button">
            <span id="profileInitial">P</span>
        </button>

        <div id="profileMenu" class="profile-menu">

            <div class="profile-info">
                <strong id="profileName">Citizen</strong>
                <small id="profileEmail">email@example.com</small>
                <span
                    id="profileRole"
                    class="profile-role">
                    CITIZEN
                </span>
            </div>

            <button
                type="button"
                id="dashboardButton">
                🏠 Dashboard
            </button>

            <button
                type="button"
                id="communityButton">
                🌐 Community Issues
            </button>

            <button
                type="button"
                id="myReportsButton">
                📋 My Reports
            </button>

            <button
                type="button"
                id="adminDashboardButton"
                style="display: none;">
                🛠️ Admin Dashboard
            </button>

            <button
                type="button"
                id="logoutButton"
                class="logout-button">
                🚪 Logout
            </button>

        </div>

    </div>

</header>


<main class="container">

    <section class="dashboard-welcome">

        <h1>My Reported Issues</h1>

        <p>
            View and manage the civic issues you have reported.
        </p>

    </section>


    <section class="report-card">

        <h2>Your Reports</h2>

        <p class="details-help">
            Click on a report to view its complete details.
        </p>

        <button
            type="button"
            id="reportNewButton"
            class="auth-button report-new-button">
            + Report New Issue
        </button>

        <div
            id="myIssues"
            class="issue-list">

            <p>Loading your reports...</p>

        </div>

    </section>

</main>


<script src="my-reports.js"></script>

</body>
</html>
