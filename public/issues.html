<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Issues - CivicFix</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <style>
        .community-page {
            padding-bottom: 40px;
        }

        .community-header {
            margin-bottom: 24px;
        }

        .community-header h1 {
            margin-bottom: 6px;
        }

        .community-header p {
            color: var(--muted);
        }

        .community-filters {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            margin-bottom: 25px;
            align-items: end;
        }

        .filter-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .filter-group select {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            color: var(--text);
        }

        .refresh-button {
            height: 44px;
            padding: 0 18px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: white;
            color: var(--text);
            font-weight: 600;
        }

        .refresh-button:hover {
            background: #f1f5f9;
        }

        .community-issues {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 20px;
        }

        .community-issue-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .community-issue-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.10);
        }

        .issue-photo {
            width: 100%;
            height: 210px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .issue-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .issue-no-photo {
            color: var(--muted);
            font-size: 14px;
        }

        .community-issue-content {
            padding: 18px;
        }

        .issue-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .issue-category {
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
        }

        .issue-status {
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .issue-status.open {
            background: #fee2e2;
            color: #dc2626;
        }

        .issue-status.in-progress {
            background: #fef3c7;
            color: #d97706;
        }

        .issue-status.resolved {
            background: #dcfce7;
            color: #16a34a;
        }

        .community-issue-content h3 {
            font-size: 19px;
            margin-bottom: 8px;
            color: var(--text);
            word-break: break-word;
        }

        .issue-description {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 14px;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .issue-info {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 15px;
            font-size: 13px;
            color: var(--muted);
        }

        .issue-info div {
            display: flex;
            gap: 7px;
            align-items: flex-start;
        }

        .issue-info span {
            word-break: break-word;
        }

        .issue-footer {
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .issue-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--muted);
        }

        .issue-actions {
            display: flex;
            gap: 9px;
        }

        .issue-actions button {
            flex: 1;
            height: 40px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .like-button {
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
        }

        .like-button:hover {
            background: #f1f5f9;
        }

        .like-button.upvoted {
            background: #e0f2fe;
            border-color: #7dd3fc;
            color: #0369a1;
        }

        .details-button {
            border: none;
            background: var(--primary);
            color: white;
        }

        .details-button:hover {
            background: var(--primary-dark);
        }

        .community-message {
            grid-column: 1 / -1;
            background: white;
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
            color: var(--muted);
        }

        .page-message {
            margin-bottom: 18px;
            padding: 12px 15px;
            border-radius: 9px;
            font-size: 14px;
            display: none;
        }

        .page-message.show {
            display: block;
        }

        .page-message.success {
            background: #dcfce7;
            color: #166534;
        }

        .page-message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 750px) {
            .community-filters {
                grid-template-columns: 1fr;
            }

            .refresh-button {
                width: 100%;
            }

            .community-issues {
                grid-template-columns: 1fr;
            }

            .issue-photo {
                height: 220px;
            }
        }

        @media (max-width: 480px) {
            .community-issue-content {
                padding: 15px;
            }

            .issue-actions {
                flex-direction: column;
            }

            .issue-actions button {
                width: 100%;
            }

            .issue-meta {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="dashboard-header">

    <div class="header-title">
        <h1>CivicFix</h1>
        <span>Community Issues</span>
    </div>

    <div class="profile-container">

        <button
            type="button"
            id="profileButton"
            class="profile-button">

            <span id="profileInitial">P</span>

        </button>

        <div
            id="profileMenu"
            class="profile-menu">

            <div class="profile-info">

                <strong id="profileName">
                    Citizen
                </strong>

                <small id="profileEmail">
                    email@example.com
                </small>

                <span
                    id="profileRole"
                    class="profile-role">
                    CITIZEN
                </span>

            </div>

            <button
                type="button"
                id="dashboardButton">
                🏠 Dashboard
            </button>

            <button
                type="button"
                id="myReportsButton">
                📋 My Reports
            </button>

            <button
                type="button"
                id="adminDashboardButton"
                style="display: none;">
                🛠️ Admin Dashboard
            </button>

            <button
                type="button"
                id="logoutButton"
                class="logout-button">
                🚪 Logout
            </button>

        </div>

    </div>

</header>


<main class="container community-page">

    <section class="community-header">

        <h1>Reported Civic Issues</h1>

        <p>
            View problems reported by citizens and support issues in your community.
        </p>

    </section>


    <div id="pageMessage" class="page-message"></div>


    <section class="community-filters">

        <div class="filter-group">

            <label for="categoryFilter">
                Category
            </label>

            <select id="categoryFilter">

                <option value="">
                    All Categories
                </option>

                <option value="POTHOLE">
                    Pothole
                </option>

                <option value="GARBAGE">
                    Garbage
                </option>

                <option value="STREETLIGHT">
                    Streetlight
                </option>

                <option value="DRAINAGE">
                    Drainage
                </option>

                <option value="ROAD_DAMAGE">
                    Road Damage
                </option>

                <option value="WATER_LEAK">
                    Water Leak
                </option>

                <option value="TRAFFIC">
                    Traffic Problem
                </option>

                <option value="OTHER">
                    Other
                </option>

            </select>

        </div>


        <div class="filter-group">

            <label for="statusFilter">
                Status
            </label>

            <select id="statusFilter">

                <option value="">
                    All Statuses
                </option>

                <option value="OPEN">
                    Open
                </option>

                <option value="IN_PROGRESS">
                    In Progress
                </option>

                <option value="RESOLVED">
                    Resolved
                </option>

            </select>

        </div>


        <button
            type="button"
            id="refreshButton"
            class="refresh-button">

            🔄 Refresh

        </button>

    </section>


    <div class="view-controls">
        <div class="view-toggle" role="group" aria-label="View mode">
            <button
                type="button"
                id="cardViewBtn"
                class="view-toggle-btn active">
                📋 Card Grid
            </button>
            <button
                type="button"
                id="mapViewBtn"
                class="view-toggle-btn">
                🗺️ Map View
            </button>
        </div>
        <div id="issueCountBadge" class="issue-count-badge"></div>
    </div>


    <section id="mapViewSection" class="community-map-section" style="display: none;">
        <div id="map" class="community-map"></div>
        <div class="map-legend">
            <span class="legend-item"><span class="legend-dot status-open"></span> Open</span>
            <span class="legend-item"><span class="legend-dot status-progress"></span> In Progress</span>
            <span class="legend-item"><span class="legend-dot status-resolved"></span> Resolved</span>
        </div>
    </section>


    <section
        id="issuesList"
        class="community-issues">

        <div class="community-message">
            Loading issues...
        </div>

    </section>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="public.js"></script>

</body>

</html>
