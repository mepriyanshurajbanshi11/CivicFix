<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CivicFix - Public Issues</title>
    <meta name="description" content="CivicFix Public Issues Feed — View community civic reports, road hazards, and neighborhood problems.">

    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <script src="icons.js"></script>
</head>

<body>
<a href="#main-content" class="skip-link">Skip to public feed</a>

<header class="dashboard-header">

    <div class="header-title">
        <h1>Civic<span>Fix</span></h1>
        <span>Public Civic Issues</span>
    </div>

    <div class="public-nav">
        <button
            type="button"
            id="themeToggleBtn"
            class="theme-toggle-btn"
            title="Toggle Dark / Light Mode"
            aria-label="Toggle Dark / Light Mode"
        >
        </button>

        <div class="lang-selector-container notranslate" translate="no">
            <div class="lang-select-wrapper">
                <svg class="lang-globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
                </svg>
                <select class="lang-select notranslate" aria-label="Choose Language">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                    <option value="bn">বাংলা (Bengali)</option>
                    <option value="mr">मराठी (Marathi)</option>
                    <option value="te">తెలుగు (Telugu)</option>
                    <option value="ta">தமிழ் (Tamil)</option>
                    <option value="gu">ગુજરાતી (Gujarati)</option>
                    <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                    <option value="ur">اردو (Urdu)</option>
                    <option value="kn">ಕನ್ನಡ (Kannada)</option>
                    <option value="ml">മലയാളം (Malayalam)</option>
                    <option value="or">ଓଡ଼ିଆ (Odia)</option>
                </select>
                <svg class="lang-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>

        <a
            href="/dashboard.html"
            class="nav-link"
        >
            Dashboard
        </a>

        <a
            href="/my-reports.html"
            class="nav-link"
        >
            My Reports
        </a>

        <button
            type="button"
            id="publicLogoutButton"
            class="nav-logout"
        >
            Logout
        </button>

    </div>

</header>


<main class="container" id="main-content">

    <section class="public-hero">

        <h2>
            Community Issues
        </h2>

        <p>
            View civic problems reported by citizens
            and help bring attention to important issues.
        </p>

    </section>


    <section class="public-controls">

        <div class="form-group">

            <label for="categoryFilter">
                Category
            </label>

            <select id="categoryFilter">

                <option value="">
                    All Categories
                </option>

                <option value="POTHOLE">
                    Pothole
                </option>

                <option value="GARBAGE">
                    Garbage
                </option>

                <option value="STREETLIGHT">
                    Streetlight
                </option>

                <option value="DRAINAGE">
                    Drainage
                </option>

                <option value="ROAD_DAMAGE">
                    Road Damage
                </option>

                <option value="WATER">
                    Water Problem
                </option>

                <option value="TRAFFIC">
                    Traffic Problem
                </option>

                <option value="OTHER">
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="statusFilter">
                Status
            </label>

            <select id="statusFilter">

                <option value="">
                    All Statuses
                </option>

                <option value="OPEN">
                    Open
                </option>

                <option value="IN_PROGRESS">
                    In Progress
                </option>

                <option value="RESOLVED">
                    Resolved
                </option>

            </select>

        </div>


        <button
            type="button"
            id="refreshIssuesButton"
            class="refresh-button"
        >
            Refresh
        </button>

    </section>


    <section>

        <div
            id="publicIssuesList"
            class="public-issues-grid"
        >
            <div class="empty-state">
                <p>
                    Loading issues...
                </p>
            </div>
        </div>

    </section>

</main>


<script src="language.js"></script>
<script src="public.js"></script>

</body>
</html>
