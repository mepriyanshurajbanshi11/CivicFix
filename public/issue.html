<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue Details - CivicFix</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="dashboard-header">

    <div class="header-title">
        <h1>CivicFix</h1>
        <span>Smart Civic Issue & Road Hazard Tracker</span>
    </div>

    <div class="header-actions">
        <div class="lang-selector-container notranslate" translate="no">
            <div class="lang-select-wrapper">
                <svg class="lang-globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
                </svg>
                <select class="lang-select notranslate" aria-label="Choose Language">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी (Hindi)</option>
                    <option value="bn">বাংলা (Bengali)</option>
                    <option value="mr">मराठी (Marathi)</option>
                    <option value="te">తెలుగు (Telugu)</option>
                    <option value="ta">தமிழ் (Tamil)</option>
                    <option value="gu">ગુજરાતી (Gujarati)</option>
                    <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                    <option value="ur">اردو (Urdu)</option>
                    <option value="kn">ಕನ್ನಡ (Kannada)</option>
                    <option value="ml">മലയാളം (Malayalam)</option>
                    <option value="or">ଓଡ଼ିଆ (Odia)</option>
                </select>
                <svg class="lang-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </div>

        <div class="profile-container">

        <button
            type="button"
            id="profileButton"
            class="profile-button">

            <span id="profileInitial">P</span>

        </button>


        <div
            id="profileMenu"
            class="profile-menu">

            <div class="profile-info">

                <strong id="profileName">
                    Citizen
                </strong>

                <small id="profileEmail">
                    email@example.com
                </small>

                <span
                    id="profileRole"
                    class="profile-role">
                    CITIZEN
                </span>

            </div>


            <button
                type="button"
                id="dashboardButton">
                🏠 Dashboard
            </button>


            <button
                type="button"
                id="communityButton">
                🌐 Community Issues
            </button>


            <button
                type="button"
                id="myReportsButton">
                📋 My Reports
            </button>


            <button
                type="button"
                id="adminDashboardButton"
                style="display: none;">
                🛠️ Admin Dashboard
            </button>


            <button
                type="button"
                id="logoutButton"
                class="logout-button">
                🚪 Logout
            </button>

        </div>

    </div>

    </div>

</header>


<main class="container">


    <button
        type="button"
        id="backButton"
        class="back-button">

        ← Back

    </button>


    <section
        id="issueDetails"
        class="issue-details-card">

        <p>
            Loading issue details...
        </p>

    </section>


    <!-- COMMENTS -->

    <section class="issue-details-card comments-section">

        <h2>
            💬 Comments
        </h2>


        <form id="commentForm">

            <div class="form-group">

                <textarea
                    id="commentInput"
                    placeholder="Write a comment..."
                    maxlength="500"
                    required>
                </textarea>

            </div>


            <button
                type="submit"
                class="auth-button">

                Add Comment

            </button>

        </form>


        <div
            id="commentsList"
            class="comments-list">

            <p>
                Loading comments...
            </p>

        </div>

    </section>

</main>


<script src="language.js"></script>
<script src="issue.js"></script>

</body>

</html>
