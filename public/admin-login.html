<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - CivicFix</title>
    <meta name="description" content="CivicFix Admin Portal — Authorized municipal staff login for managing citizen reports and tracking resolutions.">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0284c7">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <script src="icons.js"></script>
</head>

<body>
    <a href="#adminLoginForm" class="skip-link">Skip to admin login</a>

    <main class="auth-container" id="main-content">

        <div class="auth-lang-picker notranslate" translate="no">
            <button
                type="button"
                id="themeToggleBtn"
                class="theme-toggle-btn"
                title="Toggle Dark / Light Mode"
                aria-label="Toggle Dark / Light Mode"
            >
            </button>
            <div class="lang-selector-container">
                <div class="lang-select-wrapper">
                    <svg class="lang-globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
                    </svg>
                    <select class="lang-select notranslate" aria-label="Choose Language">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी (Hindi)</option>
                        <option value="bn">বাংলা (Bengali)</option>
                        <option value="mr">मराठी (Marathi)</option>
                        <option value="te">తెలుగు (Telugu)</option>
                        <option value="ta">தமிழ் (Tamil)</option>
                        <option value="gu">ગુજરાતી (Gujarati)</option>
                        <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
                        <option value="ur">اردو (Urdu)</option>
                        <option value="kn">ಕನ್ನಡ (Kannada)</option>
                        <option value="ml">മലയാളം (Malayalam)</option>
                        <option value="or">ଓଡ଼ିଆ (Odia)</option>
                    </select>
                    <svg class="lang-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>
        </div>

        <section class="auth-card">

            <div class="auth-header" style="text-align: center; margin-bottom: 20px;">
                <div class="auth-brand-badge admin" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                </div>
                <h1 style="font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Civic<span style="color: #3b82f6;">Fix</span></h1>
                <p style="color: var(--muted); font-size: 13px;">Municipal Control Center</p>
            </div>


            <h2>Admin Login</h2>

            <p class="auth-subtitle">
                Authorized administrators only
            </p>


            <form id="adminLoginForm">

                <div class="form-group">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required>

                </div>


                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter password"
                            required>
                        <button
                            type="button"
                            class="password-toggle-btn"
                            aria-label="Show password"
                            aria-pressed="false"
                            title="Show password"
                        >
                            <span class="password-toggle-icon" data-icon="eye" aria-hidden="true"></span>
                        </button>
                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-button">
                    Login as Admin
                </button>


                <p
                    id="adminLoginMessage"
                    class="form-message">
                </p>

            </form>


            <div class="auth-footer">

                <button
                    type="button"
                    id="backToLogin"
                    class="text-button">
                    ← Back to User Login
                </button>

            </div>

        </section>

    </main>


    <script>

        const adminLoginForm =
            document.getElementById('adminLoginForm');

        const adminEmail =
            document.getElementById('adminEmail');

        const adminPassword =
            document.getElementById('adminPassword');

        const adminLoginMessage =
            document.getElementById('adminLoginMessage');

        const backToLogin =
            document.getElementById('backToLogin');


        adminLoginForm.addEventListener(
            'submit',
            async (event) => {

                event.preventDefault();

                adminLoginMessage.textContent = '';
                adminLoginMessage.className =
                    'form-message';

                try {

                    const response =
                        await fetch('/api/login', {

                            method: 'POST',

                            headers: {
                                'Content-Type':
                                    'application/json'
                            },

                            body: JSON.stringify({
                                email:
                                    adminEmail.value.trim(),
                                password:
                                    adminPassword.value
                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error ||
                            'Login failed.'
                        );

                    }


                    if (
                        !data.user ||
                        data.user.role !== 'ADMIN'
                    ) {

                        throw new Error(
                            'This account is not authorized for admin access.'
                        );

                    }


                    localStorage.setItem(
                        'civic_token',
                        data.token
                    );

                    localStorage.setItem(
                        'civic_user',
                        JSON.stringify(data.user)
                    );


                    adminLoginMessage.textContent =
                        'Login successful.';

                    adminLoginMessage.className =
                        'form-message success';


                    setTimeout(() => {

                        window.location.href =
                            '/admin.html';

                    }, 500);

                } catch (error) {

                    adminLoginMessage.textContent =
                        error.message ||
                        'Unable to login.';

                    adminLoginMessage.className =
                        'form-message error';

                }

            }
        );


        backToLogin.addEventListener(
            'click',
            () => {

                window.location.href = '/';

            }
        );

    </script>
    <script src="language.js"></script>

</body>

</html>
